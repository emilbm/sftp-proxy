name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # Includes an end-to-end run against an in-process SFTP server, and the
      # symlink-escape test that is skipped on Windows.
      - run: npm test

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    # Pull requests are built to prove the Dockerfile still works, but nothing
    # from a PR is published.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated. ssh2 is installed without its native addon, so the
      # build is pure JS and this costs seconds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=sftp-proxy@${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          # No SFTP server here; the site must still start, answer /health and
          # put the login page in front of everything else.
          docker run -d --name smoke \
            -e SFTP_HOST=127.0.0.1 -e SFTP_USERNAME=x -e SFTP_PASSWORD=x \
            -e SITE_PASSWORD=smoke-test-password \
            -p 18080:8080 ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS localhost:18080/health > /dev/null; then
              echo "health endpoint answered"
              test "$(curl -s -o /dev/null -w '%{http_code}' localhost:18080/browse/)" = 303
              curl -fsS localhost:18080/login | grep -q 'type="password"'
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "image did not become healthy"
          docker logs smoke
          exit 1
